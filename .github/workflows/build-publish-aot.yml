name: build-publish-aot

on:
  workflow_call:
    inputs:
      project:
        description: "The .NET project to publish container images for"
        type: string
        required: true
      build-script:
        description: "The path to the build script to run"
        type: string
        required: false
        default: '.\build\build.ps1'
      publish-aot-script:
        description: "The path to the publish-aot script to run"
        type: string
        required: false
        default: '.\build\publish-aot.ps1'

env:
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_MULTILEVEL_LOOKUP: 0
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  FORCE_COLOR: 1
  NUGET_XMLDOC_MODE: skip
  TERM: xterm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.0.2

      - name: Install .NET Workloads
        run: dotnet workload restore

      - name: Build & Test
        shell: pwsh
        run: ${{ inputs.build-script }}

  publish-aot:
    strategy:
      matrix:
        architecture: [arm64, amd64]
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1

      - name: Publish AOT
        shell: pwsh
        run: ${{ inputs.publish-aot-script }} -RuntimeIdentifier linux-${{ matrix.architecture }}

      - name: Publish AOT Build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publish-aot-${{ matrix.architecture }}
          path: ./artifacts/publish/${{ inputs.project }}/release_linux-${{ matrix.architecture == 'amd64' && 'x64' || matrix.architecture }}
